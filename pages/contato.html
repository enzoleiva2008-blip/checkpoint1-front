<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripWay - Contato</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <div class="logo">TripWay</div>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="./destinos.html">Destinos</a></li>
        <li><a href="./pacotes.html">Pacotes</a></li>
        <li><a href="./contato.html" class="ativo">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="titulo-pagina">
      <h1>Entre em Contato</h1>
      <p>Preencha o formulário abaixo e nossa equipe entrará em contato em até 24 horas.</p>
    </section>

    <section id="contato">
      <form id="formulario-contato">

        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="campo">
          <label for="destino">Destino de interesse</label>
          <input type="text" id="destino" name="destino" placeholder="Ex: Maldivas, Paris, Tokyo..." required>
        </div>

        <div class="campo">
          <label for="data">Data de viagem</label>
          <input type="date" id="data" name="data" required>
        </div>

        <div class="campo">
          <label for="pessoas">Quantidade de pessoas</label>
          <input type="number" id="pessoas" name="pessoas" min="1" max="20" placeholder="Ex: 2" required>
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Conte mais sobre a viagem que você deseja..." required></textarea>
        </div>

        <button type="submit" class="btn">Enviar Mensagem</button>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 TripWay - Guia de Viagens. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
